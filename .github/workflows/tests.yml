name: tests

on:
  push:
  pull_request:

jobs:
  static-generator:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - working-directory: static_generator
        run: pip install -e ".[dev]"
      - working-directory: static_generator
        run: pytest -q
  release-source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_pack.py --out /tmp/wau_weighted_auto_upgrade.pack
      - run: python tools/verify_release.py --pack /tmp/wau_weighted_auto_upgrade.pack
